name: preview

permissions: {}

on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - '**/*'
      - '!.github/workflows/*.yml'
      - '.github/workflows/preview.yml'
      - '!assets/**'
      - '!docs/**'
      - '!example/**'
      - '!site/**'
      - '!test/**'
      - '!.node-version'
      - '!.nvmrc'
      - '!.prettierignore'
      - '!.prettierrc.json'
      - '!*.md'
      - '!deno.check*'
      - '!deno.lint.json'
      - '!docker-compose.yml'
      - '!jsr.json'
      - '!LICENSE'

jobs:
  release:
    concurrency:
      cancel-in-progress: ${{ github.ref_name != 'master' }}
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}

    name: Release preview build
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: false # cache can be poisoned by malicious actors.

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          package-manager-cache: false # cache can be poisoned by malicious actors.
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Release preview version
        run: pnpm dlx pkg-pr-new@0.0.71 publish --template './example'
