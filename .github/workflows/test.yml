name: test

on:
  push:
    branches:
      - master
    paths:
      - '**/*'
      - '!.github/workflows/*.yml'
      - '.github/workflows/test.yml'
      - '!assets/**'
      - '!docs/**'
      - '!example/**'
      - '!site/**'
      - '!.node-version'
      - '!.nvmrc'
      - '!.prettierignore'
      - '!.prettierrc.json'
      - '!*.md'
      - '!LICENSE'
  pull_request:
    paths:
      - '**/*'
      - '!.github/workflows/*.yml'
      - '.github/workflows/test.yml'
      - '!assets/**'
      - '!docs/**'
      - '!example/**'
      - '!site/**'
      - '!.node-version'
      - '!.nvmrc'
      - '!.prettierignore'
      - '!.prettierrc.json'
      - '!*.md'
      - '!LICENSE'
  workflow_dispatch:

permissions: {}

jobs:
  node:
    concurrency:
      cancel-in-progress: ${{ github.ref_name != 'master' }}
      group: ${{ github.workflow }}-${{ matrix.variant }}-node-${{ matrix.node-version }}-with-transformer-${{ matrix.with-transformer }}-${{ github.event.pull_request.number || github.sha }}

    name: ${{ matrix.variant }} on Node.js (${{ matrix.node-version }})${{ matrix.with-transformer && ' /w transformer' || '' }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # https://endoflife.date/nodejs
        node-version: [22.x, 24.x, 26.x]
        variant: ['postgres', 'mysql', 'mssql', 'sqlite', 'pglite']
        with-transformer: [false, true]

    steps:
      - name: harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: spin up database
        if: ${{ matrix.variant != 'sqlite' && matrix.variant != 'pglite' }}
        uses: $/.github/actions/start-test-databases
        with:
          services: ${{ matrix.variant == 'mssql' && 'mssql waitmssql' || matrix.variant }}

      - name: install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: use node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: install dependencies
        run: pnpm install && pnpm rebuild better-sqlite3

      - name: Run ${{ matrix.variant }} tests
        env:
          DIALECTS: ${{ matrix.variant }}
          TEST_TRANSFORMER: ${{ matrix.with-transformer && '1' || '' }}
        run: pnpm run test

      - name: Run esbuild test
        if: ${{ !matrix.with-transformer }}
        run: pnpm run test:esbuild

  deno:
    concurrency:
      cancel-in-progress: ${{ github.ref_name != 'master' }}
      group: ${{ github.workflow }}-deno-${{ matrix.deno-version }}-${{ github.event.pull_request.number || github.sha }}

    name: Deno
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # https://endoflife.date/deno
        deno-version: [2.9.x]

    steps:
      - name: harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: spin up databases
        uses: $/.github/actions/start-test-databases

      - name: install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: use node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: use deno ${{ matrix.deno-version }}
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ matrix.deno-version }}

      - name: install dependencies
        run: pnpm install

      - name: build
        run: pnpm run build

      - name: run deno tests
        run: pnpm run test:deno

      - name: lint for deno/jsr
        run: pnpm run lint:deno

  bun:
    concurrency:
      cancel-in-progress: ${{ github.ref_name != 'master' }}
      group: ${{ github.workflow }}-bun-${{ matrix.bun-version }}-${{ github.event.pull_request.number || github.sha }}

    name: Bun
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        bun-version: [1.1.44, 1.2.23, 1.3]

    steps:
      - name: harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: spin up databases
        uses: $/.github/actions/start-test-databases

      - name: install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: use node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: install dependencies
        run: pnpm install

      - name: use bun ${{ matrix.bun-version }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: run bun tests
        run: pnpm run test:bun

  browser:
    concurrency:
      cancel-in-progress: ${{ github.ref_name != 'master' }}
      group: ${{ github.workflow }}-browser-${{ github.event.pull_request.number || github.sha }}

    name: Browser
    runs-on: ubuntu-latest

    steps:
      - name: harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: use node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: install dependencies
        run: pnpm install

      - name: install playwright
        run: pnpm exec playwright install chromium

      - name: run browser tests
        run: pnpm run test:browser

  cloudflare-workers:
    concurrency:
      cancel-in-progress: ${{ github.ref_name != 'master' }}
      group: ${{ github.workflow }}-cloudflare-workers-${{ github.event.pull_request.number || github.sha }}

    name: Cloudflare Workers
    runs-on: ubuntu-latest

    steps:
      - name: harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: use node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: install dependencies
        run: pnpm install

      - name: spin up databases
        uses: $/.github/actions/start-test-databases

      - name: run cloudflare workers test
        run: pnpm run test:cloudflare-workers

  typescript-version:
    concurrency:
      cancel-in-progress: ${{ github.ref_name != 'master' }}
      group: ${{ github.workflow }}-typescript-version-${{ matrix.typescript-version }}-${{ github.event.pull_request.number || github.sha }}

    name: TypeScript (${{ matrix.typescript-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - typescript-version: ~5.4.0
            tsd-version: 0.31.2
          - typescript-version: ~5.8.0
            tsd-version: 0.32.0
          - typescript-version: ~5.9.0
            tsd-version: 0.33.0
          - typescript-version: ~6.0.0
            tsd-version: ''
          - typescript-version: ~7.0.0
            tsd-version: ''

    steps:
      - name: harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: use node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: install dependencies
        run: pnpm install

      - name: run build with the main typescript compiler
        run: pnpm run build

      - name: install typescript and matching tsd
        env:
          TS_VERSION: ${{ matrix.typescript-version }}
          TSD_VERSION: ${{ matrix.tsd-version }}
        run: |
          if [ -n "$TSD_VERSION" ]; then
            pnpm i -D "typescript@$TS_VERSION" "tsd@$TSD_VERSION"
          else
            pnpm i -D "typescript@$TS_VERSION"
          fi
          # Refresh pnpm's dependency verification state after changing versions.
          pnpm install

      - name: make `tsconfig` backwards compatible
        id: typecheck-setup
        run: pnpm run script:override-tsconfig-target

      - name: run vitest typing tests
        run: |
          node node_modules/typescript/bin/tsc --version
          pnpm run test:typings:vitest

      - name: run tsd typing tests
        if: ${{ !cancelled() && steps.typecheck-setup.outcome == 'success' && matrix.tsd-version != '' }}
        run: pnpm run test:typings

      - name: build node tests with the selected typescript compiler
        if: ${{ !cancelled() && steps.typecheck-setup.outcome == 'success' }}
        run: pnpm run test:node:build

  jsdocs:
    concurrency:
      cancel-in-progress: ${{ github.ref_name != 'master' }}
      group: ${{ github.workflow }}-jsdocs-${{ github.event.pull_request.number || github.sha }}

    name: JSDocs
    runs-on: ubuntu-latest

    steps:
      - name: harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: use node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: use deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.x

      - name: install dependencies
        run: pnpm install

      - name: build
        run: pnpm run build

      - name: type-check jsdocs code blocks
        run: pnpm run test:jsdocs

  typescript-composite:
    concurrency:
      cancel-in-progress: ${{ github.ref_name != 'master' }}
      group: ${{ github.workflow }}-typescript-composite-${{ github.event.pull_request.number || github.sha }}

    name: TypeScript Composite
    runs-on: ubuntu-latest

    steps:
      - name: harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: use node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: install dependencies
        run: pnpm i

      - name: test
        working-directory: test/composite-ts
        run: npm i && npm run check:types

  npm:
    concurrency:
      cancel-in-progress: ${{ github.ref_name != 'master' }}
      group: ${{ github.workflow }}-npm-${{ github.event.pull_request.number || github.sha }}

    name: npm
    permissions:
      contents: read
    runs-on: ubuntu-latest

    env:
      DIST_TAG: latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Need full history to check branch ancestry
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: false # cache can be poisoned by malicious actors.

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          package-manager-cache: false # cache can be poisoned by malicious actors.
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm i --frozen-lockfile --prefer-offline

      - name: Publish (dry run)
        run: pnpm stage publish --no-git-checks --tag "$DIST_TAG" --dry-run # the workflow runs in a detached head state, so git checks fail

  jsr:
    concurrency:
      cancel-in-progress: ${{ github.ref_name != 'master' }}
      group: ${{ github.workflow }}-jsr-${{ github.event.pull_request.number || github.sha }}

    name: JSR
    runs-on: ubuntu-latest

    steps:
      - name: harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: use node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: install dependencies
        run: pnpm i

      - name: prepare for publish
        run: pnpm run script:remove-global-augmentations

      - name: dry-run jsr publish
        run: pnpm exec jsr publish --allow-dirty --dry-run
