name: agent docs

permissions:
  contents: read

on:
  pull_request:
    paths:
      - '.github/workflows/afdocs.yml'
      - 'site/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  push:
    branches: [master]
    paths:
      - '.github/workflows/afdocs.yml'
      - 'site/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

jobs:
  check:
    name: Check agent documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      cancel-in-progress: true
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    env:
      DOCS_URL: http://127.0.0.1:3000

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          cache: true

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        working-directory: site
        run: pnpm build

      - name: Run afdocs
        id: scan
        working-directory: site
        run: |
          node scripts/serve-agent-docs.mts > afdocs-server.log 2>&1 &
          docs_server_pid=$!
          trap 'kill "$docs_server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 20 --retry-connrefused \
            --retry-delay 1 --output /dev/null "$DOCS_URL/llms.txt"
          # afdocs requires a numeric limit. Use the entire build's page count.
          page_count=$(node -e "console.log(require('node:fs').readdirSync('build', { recursive: true }).filter(path => path.endsWith('.html')).length)")
          # CDN cache headers cannot be verified against the local build.
          pnpm exec afdocs check "$DOCS_URL" \
            --canonical-origin https://kysely.dev \
            --llms-txt-url "${DOCS_URL%/}/llms.txt" \
            --sampling deterministic \
            --max-links "$page_count" \
            --skip-checks cache-header-hygiene \
            --format json > afdocs-report.json

      - name: Report results and fail on failures or errors
        if: ${{ !cancelled() && steps.scan.outcome != 'skipped' }}
        working-directory: site
        run: |
          jq -r '.results[] | "- **\(.status)** \(.id): \(.message)"' \
            afdocs-report.json | tee -a "$GITHUB_STEP_SUMMARY"
          # afdocs exits nonzero for failed checks, but not check-level errors.
          jq -e '
            (.results | type == "array" and length > 0) and
            all(.results[]; .status == "pass" or .status == "warn" or .status == "skip") and
            all(.. | objects | select(has("sampled")); .sampled == false)
          ' afdocs-report.json

      - name: Upload afdocs report
        if: ${{ !cancelled() && steps.scan.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: afdocs-report
          path: |
            site/afdocs-report.json
            site/afdocs-server.log
          if-no-files-found: error
