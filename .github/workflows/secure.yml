name: secure

on:
  push:
    branches: [master, next]
  pull_request:
    branches: ['**']

permissions: {}

jobs:
  node:
    concurrency:
      cancel-in-progress: ${{ github.ref_name != 'master' }}
      group: ${{ github.workflow }}-node-${{ github.event.pull_request.number || github.sha }}

    name: Audit Node.js dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: use node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: audit dependencies
        run: pnpm audit

  zizmor:
    concurrency:
      cancel-in-progress: ${{ github.ref_name != 'master' }}
      group: ${{ github.workflow }}-zizmor-${{ github.event.pull_request.number || github.sha }}

    name: zizmor github actions scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
          annotations: true
          persona: pedantic
