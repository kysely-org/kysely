packages:
  - './site'
  - './test/cloudflare-workers'
  - './test/ts-benchmarks'

# Allow (true) or disallow (false) script execution.
# https://pnpm.io/settings#allowbuilds
allowBuilds:
  better-sqlite3@13.0.3: true
  core-js: false # site dependency, useless scripts
  core-js-pure: false # site dependency, useless scripts
  esbuild@0.28.1 || 0.28.2: true # tsx@4.3.1 / docusaurus dependency || direct.
  sharp: false # wrangler dependency, useless scripts
  workerd@1.20261012.1: true # wrangler@4.151.0 dependency

auditConfig:
  # Don't show in `pnpm audit`.
  # https://pnpm.io/cli/audit#auditconfigignoreghsas
  ignoreGhsas:
    # braces@3.x.x
    - GHSA-vfj7-8cjw-p6xm
    # postcss-selector-parser@6.x.x
    - GHSA-rj75-hqrm-r3gf
    # prototype-pollution-vulnerable-lodash.merge-dont-upgrade
    - GHSA-h726-x36v-rx45
    # serialize-javascript@6.x.x
    - GHSA-5c6j-r48x-rmvq
    - GHSA-qj8w-gfj5-8c6v
    # tinypool@1.x.x
    - GHSA-5gmw-xhrv-c9v3
    - GHSA-85c8-ppgw-ccpr
    # uuid@8.x.x
    - GHSA-w5hq-g745-h8pq

catalogs:
  http:
    hono: 4.13.13
  node:
    pathe: 2.0.3

# Deduplicate peer dependencies.
# see: https://github.com/pnpm/pnpm/issues/11070
dedupePeers: true

# Deny package installs that don't match the supported Node.js version/s.
# https://pnpm.io/settings#enginestrict
engineStrict: true

# avoid having to use `-w` when installing packages at project root.
# https://pnpm.io/settings#ignoreworkspacerootcheck
ignoreWorkspaceRootCheck: true

# fail and don't fallback to "too new" version of packages when none of their other
# versions match `minimumReleaseAge` range (default is 1 day).
# https://pnpm.io/settings#minimumreleaseagestrict
minimumReleaseAgeStrict: true

minimumReleaseAgeExclude:
  - afdocs@0.22.2

overrides:
  # https://github.com/advisories/GHSA-6j4f-fj2g-mc7p
  # https://github.com/advisories/GHSA-qhr7-859c-m2p7
  # https://github.com/advisories/GHSA-q2hr-2g5m-vwhr
  brace-expansion@>=1.0.0 <1.1.21: 1.1.21
  brace-expansion@>=5.0.0 <5.0.12: 5.0.12
  # https://github.com/advisories/GHSA-vc2v-76pw-4v95
  compression@>=1.0.0 <1.8.2: 1.8.2
  # https://github.com/advisories/GHSA-p98j-92pf-mc4p
  # https://github.com/advisories/GHSA-6688-9rhm-gjv2
  dompurify@>=3.0.0 <3.4.16: 3.4.16
  # https://github.com/advisories/GHSA-qw65-cvwx-89v3
  # https://github.com/advisories/GHSA-hrr3-gc8f-f4qj
  fast-uri@>=3.0.0 <3.1.8: 3.1.8
  # https://github.com/advisories/GHSA-ch52-4w7c-c8xp
  http-cache-semantics@>=4.0.0 <4.3.0: 4.3.0
  # https://github.com/advisories/GHSA-6h2x-m376-mqjq
  # https://github.com/advisories/GHSA-wr44-6hxh-3jwq
  joi@>=17.0.0 <17.13.8: 17.13.8
  # https://github.com/advisories/GHSA-rj75-hqrm-r3gf
  postcss-selector-parser@>=7.0.0 <7.1.6: 7.1.6
  # https://github.com/advisories/GHSA-jqcg-44mw-7w3h
  proxy-addr@>=2.0.0 <2.0.8: 2.0.8
  # https://github.com/advisories/GHSA-x5fp-wj9c-mxmx
  qs@>=6.0.0 <6.16.0: 6.16.0
  # https://github.com/advisories/GHSA-5c6j-r48x-rmvq
  # https://github.com/advisories/GHSA-qj8w-gfj5-8c6v
  # https://github.com/advisories/GHSA-gfhx-hw2g-v5hg
  serialize-javascript@>=7.0.0 <7.1.2: 7.1.2
  # https://github.com/advisories/GHSA-pqg4-j6r4-53mv
  shell-quote@>=1.0.0 <1.11.0: 1.11.0
  # https://github.com/advisories/GHSA-68fv-2mgg-jv7q
  source-map-js@>=1.0.0 <1.2.2: 1.2.2
  # https://github.com/advisories/GHSA-w5hq-g745-h8pq
  uuid@>=11.0.0 <11.1.1: 11.1.1

# how versions get prefixed in `package.json`.
# https://pnpm.io/settings#saveprefix
savePrefix: ''

# Fail if a package's trust level has decreased compared to previous releases.
# https://pnpm.io/settings#trustpolicy
trustPolicy: no-downgrade

# A list of package selectors that should be excluded from the trust policy check.
# https://pnpm.io/settings#trustpolicyexclude
trustPolicyExclude:
  - semver@5.7.2 || 6.3.1 # tsd@0.20.0 || @docusaurus/core@3.10.0 dependency - https://socket.dev/npm/package/semver/overview/5.7.2 || https://socket.dev/npm/package/semver/overview/6.3.1

updateConfig:
  # Don't show in `pnpm outdated` or update in `pnpm update`.
  # https://pnpm.io/settings#updateconfigignoredependencies
  ignoreDependencies:
    - '@types/prototype-pollution-vulnerable-lodash.merge-dont-upgrade'
    - 'prototype-pollution-vulnerable-lodash.merge-dont-upgrade'
    - 'typescript-6'

# Prompt before running custom scripts if `node_modules` is out of date.
# https://pnpm.io/settings#verifydepsbeforerun
verifyDepsBeforeRun: prompt
